[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "duo-data-utilities"
version = "0.3.1"
description = "Pay-per-call data APIs for AI agents, one Python client: IBAN, VAT/tax ID, ISIN, GTIN validation and 29 more utilities; SEO keyword data, SERP, backlinks, Google Trends; social media data (X/Twitter, Reddit, TikTok, Bluesky); crypto funding rates, open interest. x402 USDC on Base, no API key."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Duo Data Utilities" }]
requires-python = ">=3.10"
keywords = ["iban", "isin", "vat", "tax-id", "gtin", "barcode", "mod-97", "x402", "usdc", "base", "ai-agents", "agent-tools", "pay-per-call", "no-api-key", "mcp", "seo", "seo-api", "keyword-research", "search-volume", "cpc", "keyword-difficulty", "google-trends", "serp", "backlinks", "social-media-data", "social-listening", "twitter-api", "x-api", "reddit", "tiktok", "bluesky", "hacker-news", "crypto-derivatives", "perp", "funding-rate", "funding-arbitrage", "open-interest", "futures-basis", "implied-volatility", "liquidations", "order-book", "hyperliquid", "trading-bot"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "License :: OSI Approved :: MIT License",
  "Typing :: Typed",
]
dependencies = [
  "x402[requests,evm]>=2.25.0,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.urls]
Homepage = "https://api.duoleads.com"
Documentation = "https://github.com/hiesem/duo-data-utilities#python"
Repository = "https://github.com/hiesem/duo-data-utilities"
Issues = "https://github.com/hiesem/duo-data-utilities/issues"

[tool.setuptools.packages.find]
include = ["duo_data_utilities*"]

[tool.setuptools.package-data]
duo_data_utilities = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
